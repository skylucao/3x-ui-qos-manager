name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install linters
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Release safety
        run: python tests/check_release.py
      - name: Bootstrap smoke tests
        run: python tests/test_bootstrap.py
      - name: Audit, notes and release integration tests
        run: |
          python -B -m unittest discover -s src/xray-audit -p 'test_*.py'
          python -B -m unittest discover -s src/qos-web -p 'test_*.py'
          python -B tests/test_release_integration.py
          node src/qos-web/test_notes_ui.cjs
          node src/qos-web/test_settings_ui.cjs
          node src/qos-web/test_ptr_ui.cjs
      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n scripts/*.sh
          shellcheck --severity=error install.sh scripts/*.sh
      - name: Python syntax
        run: |
          python -m py_compile src/xray-qos src/qos-web/*.py src/qos-web/ip2region/*.py src/xray-audit/*.py tests/*.py
      - name: JavaScript syntax
        run: |
          for script in src/qos-web/static/*.js; do node --check "$script"; done
